apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: poc-kuma
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: jaimehenao8126/backend:latest
          command: ["python", "-m", "http.server", "8080"]
          ports:
            - containerPort: 8080