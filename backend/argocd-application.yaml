apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kuma-apps-backend
  namespace: argocd
spec:
  project: poc-kuma
  source:
    repoURL: https://github.com/JaimeHenaoChallange/devcontainer-kuma.git
    targetRevision: HEAD
    path: backend
  destination:
    server: https://kubernetes.default.svc
    namespace: poc-kuma
  syncPolicy:
    automated:
      prune: true
      selfHeal: true